app-id: com.moohaad.BookletMaker
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: booklet-maker
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
build-options:
  append-env:
    CARGO_HOME: /run/build/booklet-maker/cargo
    CARGO_NET_OFFLINE: 'true'
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: booklet-maker
    buildsystem: simple
    build-commands:
      - cargo build --release --offline
      - install -Dm755 target/release/booklet-maker /app/bin/booklet-maker
    sources:
      - type: dir
        path: .
      - cargo-sources.json
