name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: booklet-maker
            asset_name: booklet-maker-linux-x86_64.AppImage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: booklet-maker.exe
            asset_name: booklet-maker-windows-x86_64.exe
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: booklet-maker
            asset_name: booklet-maker-macos-x86_64.dmg
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: booklet-maker
            asset_name: booklet-maker-macos-aarch64.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/${{ matrix.target }}/release/booklet-maker AppDir/usr/bin/
          
          cat <<EOF > AppDir/usr/share/applications/booklet-maker.desktop
          [Desktop Entry]
          Name=Booklet Maker
          Exec=booklet-maker
          Icon=booklet-maker
          Type=Application
          Categories=Utility;
          EOF
          
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="blue" /></svg>' > AppDir/usr/share/icons/hicolor/256x256/apps/booklet-maker.svg
          
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          mv Booklet_Maker-*.AppImage ./${{ matrix.asset_name }}
        shell: bash

      - name: Package macOS App Bundle and DMG
        if: startsWith(runner.os, 'macOS')
        run: |
          APP_NAME="BookletMaker"
          APP_DIR="${APP_NAME}.app"
          CONTENTS_DIR="${APP_DIR}/Contents"
          MACOS_DIR="${CONTENTS_DIR}/MacOS"
          RESOURCES_DIR="${CONTENTS_DIR}/Resources"
          
          mkdir -p "${MACOS_DIR}"
          mkdir -p "${RESOURCES_DIR}"
          
          cp target/${{ matrix.target }}/release/booklet-maker "${MACOS_DIR}/${APP_NAME}"
          
          cat <<EOF > "${CONTENTS_DIR}/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>com.moohaad.bookletmaker</string>
              <key>CFBundleName</key>
              <string>Booklet Maker</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          chmod +x "${MACOS_DIR}/${APP_NAME}"
          codesign --force --deep -s - "${APP_DIR}"
          
          hdiutil create -volname "Booklet Maker" -srcfolder "${APP_DIR}" -ov -format UDZO ./${{ matrix.asset_name }}
        shell: bash

      - name: Rename Artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ./${{ matrix.asset_name }}
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./${{ matrix.asset_name }}
